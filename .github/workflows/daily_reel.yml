name: Daily AI Reel Generator & Auto-Publisher

on:
  schedule:
    # Runs daily at 04:00 UTC (9:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom topic for today (leave blank for daily rotation)'
        required: false
        default: ''
      niche:
        description: 'Niche / Category'
        required: false
        default: 'General'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Background Music Presets
        run: |
          python -m core.music_generator

      - name: Run AI Reel Generator Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            python run_cli.py --prompt "${{ github.event.inputs.custom_topic }}" --niche "${{ github.event.inputs.niche }}" --publish
          else
            python -c "from core.scheduler import ReelScheduler; s = ReelScheduler(); s.run_daily_job()"
          fi

      - name: Upload Generated Reel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-${{ github.run_id }}
          path: output/
          retention-days: 14
