<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ND Reel Studio - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #181d28 0%, #0d1017 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-glow {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ff4b4b;
      border-right-color: #ff8533;
      border-bottom-color: #ffd000;
      animation: spin 1s linear infinite;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 0 14px rgba(255, 75, 75, 0.5));
    }
    .logo-emoji {
      font-size: 38px;
      line-height: 1;
      display: none;
      filter: drop-shadow(0 0 12px rgba(255, 75, 75, 0.4));
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #FF4B4B 0%, #FF8533 50%, #FFD000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-glow">
      <div class="logo-ring"></div>
      <img
        class="logo-img"
        src="nd_reel.png"
        alt="ND Reel Studio"
        onerror="this.style.display='none'; document.querySelector('.logo-emoji').style.display='block';"
      >
      <span class="logo-emoji">🎬</span>
    </div>
    <h1>ND Reel Studio</h1>
    <p>Starting AI Engine<span class="dots"></span></p>
  </div>

  <script>
    const TARGET_URL = 'http://127.0.0.1:8501';
    
    async function checkServer() {
      try {
        const response = await fetch(`${TARGET_URL}/_stcore/health`, { method: 'GET', mode: 'no-cors' });
        // Redirect immediately once port is open
        window.location.replace(TARGET_URL);
      } catch (err) {
        setTimeout(checkServer, 150);
      }
    }
    
    // Fast polling
    checkServer();
  </script>
</body>
</html>
